services:
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z #Le logiciel à télécharger depuis Docker Hub
    command: server /data --console-address ":9001" #Démarre MinIO, range les données dans /data et ouvre la console web sur le port 9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

#  service
  minio-init:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'Attente de MinIO...'; sleep 2; done;
      mc mb --ignore-existing local/bronze local/silver local/gold local/models;
      echo 'Buckets crees';
      "

#  base de donnees
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  #      jupyter
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      JUPYTER_TOKEN: portflow
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      - minio
      - mongodb



volumes:
  minio-data:
  mongo-data: